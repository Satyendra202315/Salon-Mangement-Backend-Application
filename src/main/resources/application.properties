spring.application.name=salonhub-backend
# Database connection - change username/password if different
spring.datasource.url=jdbc:mysql://localhost:3306/salonhub
spring.datasource.username=root
spring.datasource.password=Satya@123

# Show SQL queries in console (very useful while learning)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Auto-create/update tables from entities (change to 'validate' in production)
spring.jpa.hibernate.ddl-auto=update

# JWT secret key (change this to a very long random string later)
jwt.secret=your-super-secret-key-change-this-1234567890abcdef

# Server port (optional)
server.port=8080
